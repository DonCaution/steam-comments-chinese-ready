<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Friends Audit & Pruning - Steam Comment Tool</title>
<style>
body{margin:0;background:#192a3d;color:#e7f1ff;font:14px Segoe UI,Arial}
.top{padding:18px 5%;background:#1b2b40;color:#55c3ff;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.top a{color:#7cd6ff;text-decoration:none;font-weight:bold}
.top a:hover{text-decoration:underline}
.container{max-width:1350px;margin:22px auto;padding:0 14px}
.card{background:#13243a;border:1px solid #56bdf6;border-radius:8px;padding:16px;margin-bottom:18px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#0d1b2c;border:1px solid #385b78;border-radius:6px;padding:12px}
.stat b{display:block;color:#5ec9ff;font-size:22px}
.stat small{color:#aabed3}
.controls{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.field,select{padding:9px 12px;background:#2d506b;border:1px solid #5681a7;border-radius:4px;color:white;font:14px Segoe UI,Arial}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #284460}
th{background:#172e48;color:#60c7ff;font-weight:bold;cursor:pointer;user-select:none}
th:hover{background:#234468}
tr:hover{background:#1b304a}
.tag{padding:3px 7px;border-radius:4px;font-size:11px;font-weight:bold;display:inline-block}
.tag-never{background:#421a1c;color:#ff9698;border:1px solid #732a2e}
.tag-old{background:#3b320d;color:#ffd768;border:1px solid #756215}
.tag-active{background:#13331b;color:#7ce3a0;border:1px solid #235c32}
.tag-disabled{background:#2b3644;color:#a1b4c7;border:1px solid #44586e}
button{border:0;border-radius:4px;padding:7px 12px;background:#315a76;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#3f7093}
.red{background:#893537}.red:hover{background:#a84345}
.yellow{background:#a36c12}.yellow:hover{background:#c48318}
.green{background:#4d7710}.green:hover{background:#639915}
.meta{color:#9bb2ca;font-size:12px}
</style>
</head>
<body>

<div class="top">
	<span>Steam Targets & Artworks Audit</span>
	<a href="/">← Back to Main Dashboard</a>
</div>

<div class="container">
	<div class="card">
		<div class="summary">
			<div class="stat"><b id="totalCount">0</b><small>TOTAL TARGETS</small></div>
			<div class="stat"><b id="neverSentCount" style="color:#ff9698">0</b><small>NEVER SENT BACK</small></div>
			<div class="stat"><b id="inactive30Count" style="color:#ffd768">0</b><small>INACTIVE (>30 DAYS)</small></div>
			<div class="stat"><b id="totalGivenCount" style="color:#7ce3a0">0</b><small>TOTAL SENT TO THEM</small></div>
		</div>

		<div class="controls">
			<label>Type:
				<select id="typeSelect" onchange="renderTable()">
					<option value="all">All Targets (Friends & Artworks)</option>
					<option value="profile">Profile Friends Only</option>
					<option value="artwork">Artworks Only</option>
				</select>
			</label>

			<label>Sort By: 
				<select id="sortSelect" onchange="renderTable()">
					<option value="inactive">Most Inactive / Never Sent First</option>
					<option value="receivedAsc">Fewest Received Comments First</option>
					<option value="givenDesc">Most Sent Comments to Them First</option>
					<option value="name">Name (A-Z)</option>
				</select>
			</label>

			<label>Filter: 
				<select id="filterSelect" onchange="renderTable()">
					<option value="all">All Targets</option>
					<option value="never">Never Sent Any Comment Back</option>
					<option value="inactive30">Inactive > 30 Days</option>
					<option value="unreciprocated">Sent > 0, Received 0 (Unreciprocated)</option>
					<option value="active">Active (Recent)</option>
					<option value="disabled">Disabled Only</option>
				</select>
			</label>

			<input id="searchInput" class="field" placeholder="Search name, URL, or Steam ID..." oninput="renderTable()" style="min-width:240px">
		</div>

		<table>
			<thead>
				<tr>
					<th onclick="setSort('name')">Target / Owner</th>
					<th onclick="setSort('receivedLast')">Last Received From Owner</th>
					<th onclick="setSort('receivedCount')">Owner Sent (Recv)</th>
					<th onclick="setSort('givenCount')">Sent To Them</th>
					<th onclick="setSort('givenLast')">Last Sent To Them</th>
					<th>Status</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody id="auditTable">
				<tr><td colspan="7" class="meta">Loading audit data...</td></tr>
			</tbody>
		</table>
	</div>
</div>

<script>
let state = {};
let sortKey = 'inactive';
let auditLanguage = 'en';

const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>]/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
const zhAudit = [
 ['Friends Audit & Pruning - Steam Comment Tool','好友审计与清理 - Steam 评论工具'], ['Steam Targets & Artworks Audit','Steam 目标与作品审计'], ['Back to Main Dashboard','返回主仪表板'],
 ['TOTAL TARGETS','目标总数'], ['NEVER SENT BACK','从未回评'], ['INACTIVE (>30 DAYS)','不活跃（超过 30 天）'], ['TOTAL SENT TO THEM','发送给他们的总数'],
 ['Type:','类型：'], ['All Targets (Friends & Artworks)','全部目标（好友与作品）'], ['Profile Friends Only','仅个人资料好友'], ['Artworks Only','仅作品'],
 ['Sort By:','排序方式：'], ['Most Inactive / Never Sent First','最不活跃／从未回评优先'], ['Fewest Received Comments First','收到评论最少优先'], ['Most Sent Comments to Them First','发送给他们最多优先'], ['Name (A-Z)','名称（A-Z）'],
 ['Filter:','筛选：'], ['All Targets','全部目标'], ['Never Sent Any Comment Back','从未回评'], ['Inactive > 30 Days','超过 30 天不活跃'], ['Sent > 0, Received 0 (Unreciprocated)','已发送 > 0，收到 0（未互惠）'], ['Active (Recent)','活跃（近期）'], ['Disabled Only','仅已禁用'],
 ['Search name, URL, or Steam ID...','搜索名称、链接或 Steam ID……'], ['Target / Owner','目标／所有者'], ['Last Received From Owner','最后收到所有者评论'], ['Owner Sent (Recv)','所有者发送（收到）'], ['Sent To Them','发送给他们'], ['Last Sent To Them','最后发送给他们'], ['Status','状态'], ['Action','操作'], ['Loading audit data...','正在加载审计数据……'],
 ['Owner SteamID:','所有者 SteamID：'], ['Reason:','原因：'], ['Artwork','作品'], ['Friend','好友'], ['Enable','启用'], ['Disable','禁用'], ['Delete','删除'], ['Disabled','已禁用'], ['Never Responded','从未回评'], ['Inactive >30d','不活跃 >30 天'], ['Active','活跃'], ['No matching targets found for this filter.','没有符合此筛选条件的目标。'], ['Never','从未'], ['Today','今天'], ['1 day ago','1 天前'], [' days ago',' 天前']
];
function trAudit(text) { if (auditLanguage !== 'zh-CN') return text; let r = String(text); zhAudit.forEach(([a,b]) => r = r.split(a).join(b)); return r; }
function localizeAuditStatic() {
 if (auditLanguage !== 'zh-CN') return;
 document.title = trAudit(document.title);
 const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), nodes=[];
 while(w.nextNode()) { const n=w.currentNode; if(n.parentElement && !['SCRIPT','STYLE'].includes(n.parentElement.tagName)) nodes.push(n); }
 nodes.forEach(n => n.nodeValue = trAudit(n.nodeValue));
 document.querySelectorAll('[placeholder]').forEach(e => e.placeholder = trAudit(e.placeholder));
}

function key(u) {
	let m = u.match(/(?:id\/([^/?#]+)|profiles\/(\d+)|sharedfiles\/filedetails\/\?(?:.*&)?id=(\d+))/);
	return m?.[3] ? 'artwork_' + m[3] : (m?.[2] || m?.[1] || u);
}

function name(u, f) {
	const k = key(u);
	const opts = [state.names?.[k], f, k, u];
	for (let i = 0; i < opts.length; i++) {
		if (opts[i] != null) {
			let s = String(opts[i]).trim();
			if (s.length > 0) return s;
		}
	}
	return 'Steam Target';
}

function track(u, id) {
	try {
		const d = JSON.parse(state.tracking || '{}');
		if (id && d[id]) return d[id];
		return Object.entries(d).find(([k, v]) => {
			if (id && k === String(id)) return true;
			if (u && (v.profileURL === u || (v.artworkURLs && v.artworkURLs.includes(u)))) return true;
			if (u && k && u.includes(k)) return true;
			return false;
		})?.[1] || {};
	} catch {
		return {};
	}
}

function parseDate(dStr) {
	if (!dStr || dStr === 'None' || dStr === 'Never') return 0;
	let parsed = Date.parse(dStr);
	return isNaN(parsed) ? 0 : parsed;
}

function formatDaysAgo(ms) {
	if (!ms) return '<span class="tag tag-never">' + trAudit('Never') + '</span>';
	let days = Math.floor((Date.now() - ms) / (1000 * 60 * 60 * 24));
	if (days <= 0) return '<span class="tag tag-active">' + trAudit('Today') + '</span>';
	if (days === 1) return '<span class="tag tag-active">' + trAudit('1 day ago') + '</span>';
	if (days > 30) return `<span class="tag tag-old">${days}${trAudit(' days ago')}</span>`;
	return `<span class="tag tag-active">${days}${trAudit(' days ago')}</span>`;
}

function setSort(k) {
	sortKey = k;
	$('sortSelect').value = k;
	renderTable();
}

async function loadData() {
	state = await fetch('/api/state').then(r => r.json());
	try { auditLanguage = JSON.parse(state.config || '{}').language === 'zh-CN' ? 'zh-CN' : 'en'; } catch {}
	localizeAuditStatic();
	renderTable();
}

function renderTable() {
	let rawFriends = (state.friends || []).map(x => ({ ...x, targetType: 'profile' }));
	let rawArtworks = (state.artworks || []).map(x => ({ ...x, targetType: 'artwork' }));
	let allTargets = [...rawFriends, ...rawArtworks];

	$('totalCount').textContent = allTargets.length;

	let processed = allTargets.map(f => {
		let t = track(f.url, f.steamID);
		let dispName = name(f.url, f.name || t.profileName);
		let recCount = t.totalReturned || t.commentsReceived || 0;
		let givenCount = t.totalSent || t.commentsSent || 0;
		let recLastStr = t.lastProcessedIncomingAtReadable || t.lastCheckedAtReadable || 'Never';
		let givenLastStr = t.lastProcessedOutgoingAtReadable || t.lastOutgoingBatchAtReadable || t.lastSentAtReadable || 'Never';
		let recLastMs = t.lastProcessedIncomingAt || parseDate(recLastStr);
		let givenLastMs = t.lastOutgoingBatchAt || parseDate(givenLastStr);

		return {
			...f,
			dispName,
			recCount,
			givenCount,
			recLastStr,
			givenLastStr,
			recLastMs,
			givenLastMs,
			trackData: t
		};
	});

	// Counters
	let neverCount = processed.filter(x => x.recCount === 0).length;
	let inactive30 = processed.filter(x => x.recLastMs === 0 || (Date.now() - x.recLastMs) > (30 * 24 * 60 * 60 * 1000)).length;
	let totalGiven = processed.reduce((acc, x) => acc + x.givenCount, 0);

	$('neverSentCount').textContent = neverCount;
	$('inactive30Count').textContent = inactive30;
	$('totalGivenCount').textContent = totalGiven;

	// Filter
	let typeVal = $('typeSelect').value;
	let filterVal = $('filterSelect').value;
	let searchVal = $('searchInput').value.toLowerCase().trim();

	let filtered = processed.filter(x => {
		if (typeVal === 'profile' && x.targetType !== 'profile') return false;
		if (typeVal === 'artwork' && x.targetType !== 'artwork') return false;

		if (filterVal === 'never' && x.recCount > 0) return false;
		if (filterVal === 'inactive30' && (x.recLastMs > 0 && (Date.now() - x.recLastMs) <= (30 * 24 * 60 * 60 * 1000))) return false;
		if (filterVal === 'unreciprocated' && !(x.givenCount > 0 && x.recCount === 0)) return false;
		if (filterVal === 'active' && (x.recLastMs === 0 || (Date.now() - x.recLastMs) > (30 * 24 * 60 * 60 * 1000))) return false;
		if (filterVal === 'disabled' && !x.disabled) return false;

		if (searchVal) {
			let matchName = x.dispName.toLowerCase().includes(searchVal);
			let matchUrl = x.url.toLowerCase().includes(searchVal);
			let matchSteamId = (x.steamID || '').toLowerCase().includes(searchVal);
			if (!matchName && !matchUrl && !matchSteamId) return false;
		}
		return true;
	});

	// Sort
	let currentSort = $('sortSelect').value;
	filtered.sort((a, b) => {
		if (currentSort === 'inactive') {
			if (a.recLastMs !== b.recLastMs) return a.recLastMs - b.recLastMs;
			return a.recCount - b.recCount;
		}
		if (currentSort === 'receivedAsc') return a.recCount - b.recCount;
		if (currentSort === 'givenDesc') return b.givenCount - a.givenCount;
		if (currentSort === 'name') return a.dispName.localeCompare(b.dispName);
		if (currentSort === 'receivedLast') return b.recLastMs - a.recLastMs;
		if (currentSort === 'givenLast') return b.givenLastMs - a.givenLastMs;
		if (currentSort === 'receivedCount') return b.recCount - a.recCount;
		if (currentSort === 'givenCount') return b.givenCount - a.givenCount;
		return 0;
	});

	let tbody = $('auditTable');
	if (!filtered.length) {
		tbody.innerHTML = '<tr><td colspan="7" class="meta">' + trAudit('No matching targets found for this filter.') + '</td></tr>';
		return;
	}

	tbody.innerHTML = filtered.map(x => {
		let statusTag = x.disabled 
			? '<span class="tag tag-disabled">' + trAudit('Disabled') + '</span>'
			: (x.recCount === 0 
				? '<span class="tag tag-never">' + trAudit('Never Responded') + '</span>'
				: (x.recLastMs && (Date.now() - x.recLastMs) > 30*24*3600*1000 
					? '<span class="tag tag-old">' + trAudit('Inactive >30d') + '</span>'
					: '<span class="tag tag-active">' + trAudit('Active') + '</span>'));

		let badgeType = x.targetType === 'artwork'
			? '<span class="tag" style="background:#203c56;color:#7ad4ff;border:1px solid #3c658c;margin-left:6px">' + trAudit('Artwork') + '</span>'
			: '<span class="tag" style="background:#1b2d42;color:#9ab5d1;border:1px solid #334e6e;margin-left:6px">' + trAudit('Friend') + '</span>';

		return `
		<tr>
			<td>
				<b>${esc(x.dispName)}</b> ${badgeType}<br>
				<a href="${esc(x.url)}" target="_blank" class="meta" style="color:#64bbf3">${esc(x.url)}</a>
				${x.steamID ? `<br><span class="meta">${trAudit('Owner SteamID:')} <b>${esc(x.steamID)}</b></span>` : ''}
				${x.disabled && x.reason ? `<br><span class="meta" style="color:#ff9698;font-weight:bold">${trAudit('Reason:')} ${esc(x.reason)}</span>` : ''}
			</td>
			<td>
				${formatDaysAgo(x.recLastMs)}
				<br><span class="meta">${esc(x.recLastStr)}</span>
			</td>
			<td><b style="color:${x.recCount > 0 ? '#52f6d2' : '#ff9698'}">${x.recCount}</b></td>
			<td><b style="color:#7cd6ff">${x.givenCount}</b></td>
			<td>
				${formatDaysAgo(x.givenLastMs)}
				<br><span class="meta">${esc(x.givenLastStr)}</span>
			</td>
			<td>${statusTag}</td>
			<td>
				${x.disabled 
					? `<button class="green" onclick="targetAction('${x.targetType}','enable','${esc(x.url)}')">${trAudit('Enable')}</button>`
					: `<button class="yellow" onclick="targetAction('${x.targetType}','disable','${esc(x.url)}')">${trAudit('Disable')}</button>`}
				<button class="red" onclick="targetAction('${x.targetType}','remove','${esc(x.url)}')">${trAudit('Delete')}</button>
			</td>
		</tr>`;
	}).join('');
}

async function targetAction(type, action, url) {
	if (action === 'remove' && !confirm('Are you sure you want to delete this target?')) return;
	let endpoint = type === 'artwork' ? '/api/artworks' : '/api/friends';
	let r = await fetch(endpoint, {
		method: 'POST',
		headers: {'Content-Type':'application/json'},
		body: JSON.stringify({ action, url })
	});
	let j = await r.json();
	if (!j.ok) alert(j.error || 'Action failed');
	loadData();
}

loadData();
setInterval(loadData, 10000);
</script>
</body>
</html>
